name: Android CI & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble APK
        run: gradle :app:assembleDebug -Pkotlin.compiler.execution.strategy=daemon -Djava.awt.headless=true

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest -x kspDebugUnitTestKotlin -Pkotlin.compiler.execution.strategy=daemon -Djava.awt.headless=true

      - name: Prepare Release APK Asset
        run: cp app/build/outputs/apk/debug/app-debug.apk Universal-USB-Printer.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-USB-Printer-APK
          path: Universal-USB-Printer.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Universal USB Printer ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            ### Universal USB Printer — Direct APK Download
            Download **`Universal-USB-Printer.apk`** from the **Assets** section below to install directly on your Android phone or tablet.
          files: Universal-USB-Printer.apk
          draft: false
          prerelease: false
          make_latest: "true"
